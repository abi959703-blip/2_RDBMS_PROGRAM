name: Student Table Autograding

on:
  push:
  pull_request:

jobs:

  grade:

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ----------------------------------------
      # Checkout Student Repository
      # ----------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # Setup Python
      # ----------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ----------------------------------------
      # Install MySQL Connector
      # ----------------------------------------

      - name: Install Dependencies
        run: |
          pip install mysql-connector-python


      # ----------------------------------------
      # Wait for MySQL
      # ----------------------------------------

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -proot && break
            sleep 2
          done


      # ----------------------------------------
      # Run Autograding Test
      # ----------------------------------------

      - name: Run Student Table Tests
        run: |
          python test_department.py
