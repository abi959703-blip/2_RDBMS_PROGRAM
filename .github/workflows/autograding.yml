name: SQL Auto Grading

on:
  push:
  pull_request:

jobs:
  grade:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          for i in {1..30}
          do
            mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -proot && break
            sleep 2
          done

      - name: Check MySQL
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            -e "SELECT VERSION();"

      - name: Run Student Solution
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            < solution.sql

      - name: Run SQL Tests
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            < test.sql
